version: '3.8'

services:
  ips:
    image: ghcr.io/emenwin/ips:docker
    container_name: ips
    environment:
      - IPS_DIR=/app/data
    volumes:
      # 将宿主机的数据目录挂载到容器内
      # 请根据实际情况修改宿主机路径
      - /home/docker-volumes-datas/ips-data:/app/data:ro
    ports:
      - "10060:6860"
    command:
      - --file
      - GeoLite2-City.mmdb
      - --format
      - mmdb
      - --fields
      - "*"
    restart: unless-stopped

  # 如果使用配置文件方式，可以使用下面这个配置
  # ips-with-config:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: ips
  #   environment:
  #     - IPS_DIR=/app/data
  #   volumes:
  #     - ./volumes-ipip-data:/app/data:ro
  #   ports:
  #     - "6860:6860"
  #   command: ["server"]
  #   restart: unless-stopped
